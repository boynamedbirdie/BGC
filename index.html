  return{gambler:st.g,team:st.t,espnId:eid,conf:st.conf,totalW:tW,totalL:tL,regW:rW,regL:rL,confTW:cW,confTL:cL,postW:pW,postL:pL,confElim:cElim,postElim:pElim,inConf:inC,inPost:inP,confDone:cDone};
}
async function fetchAll(){
  var res=[],tot=ST.length,pr=document.getElementById("loadProgress"),fi=document.getElementById("progressFill");
  for(var i=0;i<tot;i+=8){var b=ST.slice(i,i+8);var r=await Promise.all(b.map(fetchOne));res=res.concat(r);var d=Math.min(i+8,tot);if(pr)pr.textContent=d+"/"+tot;if(fi)fi.style.width=(d/tot*100|0)+"%";}
  return res;
}

// Schedule
var sd=new Date();sd.setHours(0,0,0,0);
function d2e(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
function fD(d){var t=new Date();t.setHours(0,0,0,0);var c=new Date(d);c.setHours(0,0,0,0);var df=Math.round((c-t)/864e5);var p=df===0?"Today \u2014 ":df===-1?"Yesterday \u2014 ":df===1?"Tomorrow \u2014 ":"";return p+dN[d.getDay()]+", "+mS[d.getMonth()]+" "+d.getDate();}
function sD(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
async function loadS(d){
  var el=document.getElementById("sG");el.innerHTML='<div class="schedule-loading"><span class="mini-spinner"></span> Loading...</div>';
  document.getElementById("sD").textContent=fD(d);document.getElementById("tB").style.display=sD(d,new Date())?"none":"inline-block";
  try{var r=await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?dates="+d2e(d)+"&groups=50&limit=400");
    if(!r.ok){el.innerHTML='<div class="no-games">Could not load.</div>';return;}
    var j=await r.json(),ev=j.events||[],gm=[];
    for(var i=0;i<ev.length;i++){var e=ev[i],co=e.competitions&&e.competitions[0];if(!co)continue;var ts=co.competitors||[],aw=null,hm=null;for(var x=0;x<ts.length;x++){if(ts[x].homeAway==="away")aw=ts[x];if(ts[x].homeAway==="home")hm=ts[x];}if(!aw||!hm)continue;var s=(co.status||{}).type||{},nt="";if(co.broadcasts&&co.broadcasts[0])nt=(co.broadcasts[0].names||[]).join(", ");var gd=new Date(e.date),tm=gd.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"America/New_York"})+" ET";
      // Extract spread from odds
      var spread=null,favHome=null;
      if(co.odds&&co.odds.length>0){
        var odds=co.odds[0];
        // Try spread from the odds object
        if(odds.spread!==undefined&&odds.spread!==null){
          var sp=parseFloat(odds.spread);
          if(!isNaN(sp)&&sp!==0){
            // Negative spread means home team is favored
            // odds.spread is typically from home team perspective
            if(sp<0){favHome=true;spread=Math.abs(sp);}
            else{favHome=false;spread=sp;}
          }
        }
        // Also check details array for more specific spread info
        if(spread===null&&odds.details){
          var det=odds.details; // e.g. "UConn -7.5"
          var spMatch=det.match(/([\-]?\d+\.?\d*)\s*$/);
          if(spMatch){
            var spVal=parseFloat(spMatch[1]);
            if(!isNaN(spVal)){
              // Figure out which team is favored from the details string
              var detLo=det.toLowerCase();
              var awLo=(aw.team.abbreviation||aw.team.name||"").toLowerCase();
              var hmLo=(hm.team.abbreviation||hm.team.name||"").toLowerCase();
              if(detLo.indexOf(awLo)!==-1||detLo.indexOf((aw.team.shortDisplayName||"").toLowerCase())!==-1){
                favHome=false;spread=Math.abs(spVal);
              }else{
                favHome=true;spread=Math.abs(spVal);
              }
            }
          }
        }
        // Fallback: check homeTeamOdds/awayTeamOdds
        if(spread===null&&odds.homeTeamOdds&&odds.homeTeamOdds.spreadOdds!==undefined){
          // If home has negative spread value in the favorite field
          if(odds.homeTeamOdds.favorite===true){favHome=true;}
          else if(odds.awayTeamOdds&&odds.awayTeamOdds.favorite===true){favHome=false;}
          if(favHome!==null&&odds.spread){
            spread=Math.abs(parseFloat(odds.spread));
          }
        }
      }
      gm.push({an:aw.team.displayName||aw.team.name,as:parseInt(aw.score)||0,aw:aw.winner===true,ar:aw.curatedRank&&aw.curatedRank.current<=25?aw.curatedRank.current:null,hn:hm.team.displayName||hm.team.name,hs:parseInt(hm.score)||0,hw:hm.winner===true,hr:hm.curatedRank&&hm.curatedRank.current<=25?hm.curatedRank.current:null,dn:s.completed===true,lv:s.state==="in",dt:s.shortDetail||"",nt:nt,tm:tm,spread:spread,favHome:favHome});}
    var sg=gm.filter(function(g){return fo(g.an)||fo(g.hn);});
    if(!gm.length){el.innerHTML='<div class="no-games">No games scheduled.</div>';return;}
    if(!sg.length){el.innerHTML='<div class="no-games">No stable teams playing. ('+gm.length+' other games)</div>';return;}
    sg.sort(function(a,b){if(a.lv!==b.lv)return a.lv?-1:1;if(a.dn!==b.dn)return a.dn?1:-1;return 0;});
    var h='<div class="game-count">'+sg.length+' stable game'+(sg.length>1?'s':'')+' &middot; '+gm.length+' total</div><div class="games-list">';
    for(var i=0;i<sg.length;i++){var g=sg[i],ao=fo(g.an),ho=fo(g.hn),bo=ao&&ho;
      var rb=function(r){return r?'<span style="color:#b45309">#'+r+' </span>':'';};
      // Format spread tag
      var awSpread="",hmSpread="";
      if(g.spread!==null&&g.spread>0){
        var spStr=' <span style="font-size:10px;color:#888">-'+g.spread+'</span>';
        if(g.favHome===false)awSpread=spStr;
        else if(g.favHome===true)hmSpread=spStr;
      }
      var ac="#1a1a1a",hc="#1a1a1a";if(g.dn){ac=g.aw?"#16a34a":"#aaa";hc=g.hw?"#16a34a":"#aaa";}
      h+='<div class="game-card '+(bo?'stable-game':'')+'"><div style="text-align:right"><div class="game-team '+(ao?'in-stable':'not-stable')+'">'+rb(g.ar)+g.an+awSpread+'</div>';
      if(ao)h+='<div class="game-owner" style="color:'+GC[ao]+';text-align:right">'+ao+'</div>';
      if(g.dn||g.lv)h+='<div class="game-score" style="text-align:right;color:'+ac+'">'+g.as+'</div>';
      h+='</div><div class="game-center">';
      if(g.dn)h+='<div class="game-status-final">FINAL</div>';
      else if(g.lv)h+='<div class="game-status-live">&#x25CF; LIVE</div><div class="game-time">'+g.dt+'</div>';
      else h+='<div class="game-vs">VS</div><div class="game-time">'+g.tm+'</div>';
      if(g.nt)h+='<div class="game-network">'+g.nt+'</div>';
      h+='</div><div><div class="game-team '+(ho?'in-stable':'not-stable')+'">'+rb(g.hr)+g.hn+hmSpread+'</div>';
      if(ho)h+='<div class="game-owner" style="color:'+GC[ho]+'">'+ho+'</div>';
      if(g.dn||g.lv)h+='<div class="game-score" style="color:'+hc+'">'+g.hs+'</div>';
      h+='</div></div>';}
    h+='</div><div class="game-note">* Stable teams only. Red border = stable vs stable.</div>';
    el.innerHTML=h;
  }catch(e){el.innerHTML='<div class="no-games">Error.</div>';}
}
function cD(n){sd.setDate(sd.getDate()+n);loadS(sd);}
function gT(){sd=new Date();sd.setHours(0,0,0,0);loadS(sd);}

// Render
function getSt(td){
  var m={};td.forEach(function(t){if(!m[t.gambler])m[t.gambler]={g:t.gambler,w:0,l:0,ca:0,rW:0,rL:0,cW:0,cL:0,pW:0,pL:0};m[t.gambler].w+=t.totalW;m[t.gambler].l+=t.totalL;m[t.gambler].rW+=t.regW;m[t.gambler].rL+=t.regL;m[t.gambler].cW+=t.confTW;m[t.gambler].cL+=t.confTL;m[t.gambler].pW+=t.postW;m[t.gambler].pL+=t.postL;if(!t.confDone)m[t.gambler].ca++;});
  var a=Object.values(m).sort(function(a,b){return b.w-a.w;});
  a.forEach(function(s){s.pay=0;a.forEach(function(o){if(o.g!==s.g)s.pay+=(s.w-o.w);});});return a;
}
function cOn(td){return td.some(function(t){return t.inConf;});}
function pOn(td){return td.some(function(t){return t.inPost;});}

function renderStandings(td){
  var st=getSt(td),co=cOn(td),po=pOn(td),c=document.getElementById("tab-standings");
  var h='<div class="section-label">Standings (Live from ESPN)</div><div class="card">';
  h+='<div class="tbl-header post-grid"><div>#</div><div>Gambler</div><div class="text-center">Record</div><div class="text-right">Win%</div><div class="text-right">Current $</div><div class="text-center">Conf T Alive</div><div class="text-center">Post T Alive</div></div>';
  st.forEach(function(s,i){
    var pct=(s.w/(s.w+s.l)*100).toFixed(1)+"%";
    h+='<div class="tbl-row post-grid"><div>'+(i+1)+'</div><div>'+cn(s.g)+'</div><div class="text-center">'+s.w+'-'+s.l+'</div><div class="text-right">'+pct+'</div><div class="text-right">'+ms(s.pay)+'</div><div class="text-center">'+(co?s.ca:'?')+'</div><div class="text-center">'+(po?'?':'?')+'</div></div>';
  });
  h+='</div><div style="margin-top:24px"><div class="section-label">Schedule</div>';
  h+='<div class="schedule-nav"><button class="nav-btn" onclick="cD(-1)">&laquo; Prev</button><div><span class="nav-date" id="sD"></span><button class="nav-today-btn" id="tB" onclick="gT()" style="display:none">TODAY</button></div><button class="nav-btn" onclick="cD(1)">Next &raquo;</button></div>';
  h+='<div id="sG"></div></div>';c.innerHTML=h;loadS(sd);
}

function renderStables(td){
  var co=cOn(td),po=pOn(td),st=getSt(td),c=document.getElementById("tab-stables");var h="";
  st.forEach(function(s){
    var teams=td.filter(function(t){return t.gambler===s.g;}).sort(function(a,b){return b.totalW-a.totalW;});
    h+='<div class="card stable-card"><div class="stable-header"><div style="display:flex;align-items:center;gap:10px"><div class="stable-name">'+cn(s.g)+'</div><div style="font-size:13px">'+ms(s.pay)+'</div></div><div class="stable-stats"><div class="stable-stat"><div class="stable-stat-label">Reg</div><div class="stable-stat-val">'+s.rW+'-'+s.rL+'</div></div><div class="stable-stat"><div class="stable-stat-label">Conf T</div><div class="stable-stat-val">'+s.cW+'-'+s.cL+'</div></div><div class="stable-stat"><div class="stable-stat-label">Post T</div><div class="stable-stat-val">'+(po?s.pW+'-'+s.pL:'?')+'</div></div><div class="stable-stat"><div class="stable-stat-label">Record</div><div class="stable-stat-val">'+s.w+'-'+s.l+'</div></div></div></div>';
    h+='<div class="stable-team-hdr"><div>Team</div><div class="text-center">Conf</div><div class="text-center">Reg</div><div class="text-center">Conf T</div><div class="text-center">Post T</div><div class="text-center">Total</div></div>';
    teams.forEach(function(t){
      var cf=co?(t.inConf?(t.confTW+'-'+t.confTL):"\u2014"):"?";
      var pf=po?(t.inPost?(t.postElim?'<span class="elim">'+t.postW+'-'+t.postL+'</span>':'<span class="alive">'+t.postW+'-'+t.postL+'</span>'):"\u2014"):"?";
      h+='<div class="stable-team-row"><div>'+t.team+'</div><div class="text-center conf-tag">'+t.conf+'</div><div class="text-center">'+t.regW+'-'+t.regL+'</div><div class="text-center">'+cf+'</div><div class="text-center">'+pf+'</div><div class="text-center">'+t.totalW+'-'+t.totalL+'</div></div>';
    });h+='</div>';});c.innerHTML=h;
}

var tK="w",tD="desc";
function renderTeams(td){
  var co=cOn(td),po=pOn(td);
  var sorted=td.slice().sort(function(a,b){var k=tK,d=tD;
    if(k==="team")return d==="asc"?a.team.localeCompare(b.team):b.team.localeCompare(a.team);
    if(k==="gambler")return d==="asc"?a.gambler.localeCompare(b.gambler):b.gambler.localeCompare(a.gambler);
    if(k==="conf")return d==="asc"?a.conf.localeCompare(b.conf):b.conf.localeCompare(a.conf);
    var av=k==="w"?a.totalW:k==="rW"?a.regW:k==="cW"?a.confTW:a.postW;
    var bv=k==="w"?b.totalW:k==="rW"?b.regW:k==="cW"?b.confTW:b.postW;
    return d==="asc"?av-bv:bv-av;});
  var ar=function(col){return tK!==col?'<span class="sort-arrow dim">\u2195</span>':'<span class="sort-arrow">'+(tD==="asc"?"\u2191":"\u2193")+'</span>';};
  var c=document.getElementById("tab-teams");
  var h='<div class="section-label">All 64 Teams &mdash; Click to Sort</div><div class="card">';
  h+='<div class="tbl-header teams-grid"><div class="sortable" data-sort="team">Team '+ar("team")+'</div><div class="sortable" data-sort="conf">Conf '+ar("conf")+'</div><div class="sortable" data-sort="gambler">Owner '+ar("gambler")+'</div><div class="sortable text-center" data-sort="rW">Reg '+ar("rW")+'</div><div class="sortable text-center" data-sort="cW">Conf T '+ar("cW")+'</div><div class="sortable text-center" data-sort="pW">Post T '+ar("pW")+'</div><div class="sortable text-center" data-sort="w">Total '+ar("w")+'</div></div><div class="team-scroll">';
  sorted.forEach(function(t){
    var cf=co?(t.inConf?(t.confTW+'-'+t.confTL):"\u2014"):"?";
    var pf=po?(t.inPost?(t.postElim?'<span class="elim">'+t.postW+'-'+t.postL+'</span>':'<span class="alive">'+t.postW+'-'+t.postL+'</span>'):"\u2014"):"?";
    h+='<div class="tbl-row teams-grid team-row"><div>'+t.team+'</div><div class="conf-tag">'+t.conf+'</div><div>'+cn(t.gambler)+'</div><div class="text-center">'+t.regW+'-'+t.regL+'</div><div class="text-center">'+cf+'</div><div class="text-center">'+pf+'</div><div class="text-center">'+t.totalW+'-'+t.totalL+'</div></div>';
  });
  h+='</div></div>';c.innerHTML=h;
  c.querySelectorAll(".sortable").forEach(function(el){el.addEventListener("click",function(){var k=el.dataset.sort;if(tK===k)tD=tD==="asc"?"desc":"asc";else{tK=k;tD="desc";}renderTeams(window._td);});});
}

async function init(){
  try{var td=await fetchAll();window._td=td;
    document.getElementById("loading").style.display="none";
    renderStandings(td);renderStables(td);renderTeams(td);
    document.getElementById("lastUpdated").textContent="Live data from ESPN \u2022 "+new Date().toLocaleString();
  }catch(e){document.getElementById("loading").style.display="none";document.getElementById("error").style.display="block";document.getElementById("error").innerHTML='<div class="error-box">Error: '+e.message+'</div>';}
}
init();
</script>
