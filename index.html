<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stable Tracker — 2025–26 CBB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh;font-size:13px;font-weight:400;-webkit-font-smoothing:antialiased}

    .header{background:#fff;border-bottom:2px solid #e63946;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .header-title{font-size:20px;color:#1a1a1a}
    .header-sub{font-size:11px;color:#888;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
    .header-right{font-size:11px;color:#888;text-align:right}
    .header-right .accent{color:#e63946}

    .tabs{display:flex;border-bottom:1px solid #ddd;background:#fff}
    .tab-btn{flex:1;padding:12px;border:none;background:transparent;color:#888;font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.5px;text-transform:uppercase;transition:all .2s}
    .tab-btn.active{color:#1a1a1a;border-bottom-color:#e63946;background:#fafafa}
    .tab-btn:hover:not(.active){color:#555}

    .content{padding:20px 16px;max-width:960px;margin:0 auto}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .section-label{font-size:11px;color:#e63946;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
    .card{background:#fff;border-radius:8px;border:1px solid #e0e0e0;overflow:hidden}

    .tbl-header{display:grid;padding:10px 16px;background:#fafafa;border-bottom:1px solid #e0e0e0;font-size:11px;color:#888;letter-spacing:.5px;text-transform:uppercase}
    .tbl-row{display:grid;padding:10px 16px;border-bottom:1px solid #f0f0f0;align-items:center}
    .tbl-row:last-child{border-bottom:none}
    .tbl-row:hover{background:#fafafa}
    .standings-grid{grid-template-columns:24px 1fr 64px 52px 56px 64px 64px}
    .text-right{text-align:right}.text-center{text-align:center}

    .val-payout.pos{color:#16a34a}.val-payout.neg{color:#dc2626}.val-payout.zero{color:#888}

    /* Schedule */
    .schedule-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
    .nav-btn{background:#fff;border:1px solid #ddd;color:#555;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;transition:all .15s}
    .nav-btn:hover{background:#f5f5f5;color:#1a1a1a;border-color:#bbb}
    .nav-date{font-size:14px;color:#1a1a1a;min-width:200px;text-align:center}
    .nav-today-btn{background:transparent;border:1px solid #e6394644;color:#e63946;padding:3px 10px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.5px;transition:all .15s;margin-left:4px}
    .nav-today-btn:hover{background:#e639460d}

    .games-list{display:flex;flex-direction:column;gap:8px}
    .game-card{background:#fff;border-radius:8px;border:1px solid #e0e0e0;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
    .game-card.stable-game{border-color:#e63946;border-width:1.5px}
    .game-team{font-size:13px}
    .game-team.in-stable{color:#1a1a1a}.game-team.not-stable{color:#aaa}
    .game-owner{font-size:10px;margin-top:2px}
    .game-score{font-size:14px;margin-top:3px}
    .game-center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
    .game-vs{font-size:10px;color:#e63946;letter-spacing:1px}
    .game-time{font-size:10px;color:#888}
    .game-status-final{font-size:10px;color:#16a34a;letter-spacing:.5px}
    .game-status-live{font-size:10px;color:#e63946;letter-spacing:.5px;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .game-network{font-size:9px;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:4px}
    .game-note{margin-top:10px;font-size:10px;color:#aaa;font-style:italic}
    .game-count{font-size:11px;color:#888;text-align:center;margin-bottom:10px}
    .no-games{background:#fff;border-radius:8px;border:1px solid #e0e0e0;padding:28px;text-align:center;color:#888;font-size:13px}
    .schedule-loading{text-align:center;padding:24px;color:#888;font-size:12px}
    .schedule-loading .mini-spinner{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#e63946;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}

    /* Stables */
    .stable-card{margin-bottom:14px}
    .stable-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #e0e0e0}
    .stable-name{font-size:15px}
    .stable-stats{display:flex;gap:16px;align-items:center}
    .stable-stat{text-align:right}
    .stable-stat-label{font-size:10px;color:#888;letter-spacing:.5px;text-transform:uppercase}
    .stable-stat-val{font-size:13px}
    .stable-team-hdr{display:grid;grid-template-columns:1fr 64px 64px;padding:6px 16px;font-size:10px;color:#aaa;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #f0f0f0}
    .stable-team-row{display:grid;grid-template-columns:1fr 64px 64px;padding:7px 16px;border-bottom:1px solid #f5f5f5;align-items:center}
    .stable-team-row:last-child{border-bottom:none}

    /* Win pct badges */
    .pct-badge{font-size:11px;padding:1px 5px;border-radius:3px;display:inline-block}
    .pct-badge.sm{font-size:10px;padding:1px 4px}
    .pct-good{background:#dcfce7;color:#16a34a}
    .pct-mid{background:#fef9c3;color:#a16207}
    .pct-bad{background:#fee2e2;color:#dc2626}

    /* Teams table */
    .teams-grid{grid-template-columns:1fr 80px 64px 56px}
    .sortable{cursor:pointer;user-select:none}.sortable:hover{color:#555}
    .sort-arrow{font-size:10px}.sort-arrow.dim{opacity:.25}
    .team-scroll{max-height:600px;overflow-y:auto}
    .team-row:nth-child(even){background:#fafafa}

    .loading{text-align:center;padding:60px 20px;color:#888}
    .loading .spinner{display:inline-block;width:28px;height:28px;border:3px solid #ddd;border-top-color:#e63946;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-box{background:#fee2e2;border:1px solid #dc2626;border-radius:8px;padding:20px;color:#1a1a1a;font-size:13px;line-height:1.6}
    .error-box code{background:#f5f5f5;padding:2px 6px;border-radius:3px;font-size:12px}
    .last-updated{text-align:center;font-size:10px;color:#aaa;padding:12px;margin-top:20px}

    @media(max-width:600px){
      body{font-size:12px}
      .header{padding:14px 16px}
      .header-title{font-size:17px}
      .header-sub{font-size:9px;letter-spacing:.5px}
      .header-right{font-size:10px}
      .content{padding:12px 8px}
      .tab-btn{padding:10px 6px;font-size:11px;letter-spacing:0}
      .section-label{font-size:10px;letter-spacing:1.5px;margin-bottom:8px}

      /* Standings: stack $ columns tighter */
      .standings-grid{grid-template-columns:20px 1fr 52px 42px 44px 50px 50px}
      .tbl-header{padding:8px 10px;font-size:9px}
      .tbl-row{padding:8px 10px}

      /* Teams table */
      .teams-grid{grid-template-columns:1fr 60px 52px 44px}

      /* Schedule */
      .schedule-nav{gap:6px}
      .nav-date{font-size:12px;min-width:130px}
      .nav-btn{padding:6px 10px;font-size:11px}
      .nav-today-btn{font-size:9px;padding:2px 7px}
      .game-card{padding:10px 12px;gap:6px;grid-template-columns:1fr auto 1fr}
      .game-team{font-size:11px}
      .game-owner{font-size:9px}
      .game-score{font-size:12px}
      .game-center{min-width:50px}
      .game-vs{font-size:9px}
      .game-time{font-size:9px}
      .game-status-final,.game-status-live{font-size:9px}
      .game-network{font-size:8px;padding:1px 5px}
      .game-count{font-size:10px}
      .game-note{font-size:9px}

      /* Stables */
      .stable-header{flex-direction:column;gap:8px;align-items:flex-start;padding:10px 12px}
      .stable-name{font-size:14px}
      .stable-stats{gap:12px}
      .stable-stat-label{font-size:9px}
      .stable-stat-val{font-size:12px}
      .stable-team-hdr{padding:5px 12px;font-size:9px}
      .stable-team-row{padding:6px 12px;font-size:12px}

      .pct-badge{font-size:10px;padding:1px 4px}
      .pct-badge.sm{font-size:9px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div><div class="header-title">🏀 Stable Tracker</div><div class="header-sub">2025–26 College Basketball Season · 8 Gamblers · 64 Teams</div></div>
    <div class="header-right"><div id="todayDate"></div><div class="accent">$1 per win per opponent</div></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="standings">Standings & Schedule</button>
    <button class="tab-btn" data-tab="stables">Stables</button>
    <button class="tab-btn" data-tab="teams">Team Data</button>
  </div>
  <div class="content">
    <div id="loading" class="loading"><div class="spinner"></div><div>Loading data from Google Sheets...</div></div>
    <div id="error" style="display:none"></div>
    <div id="tab-standings" class="tab-panel active"></div>
    <div id="tab-stables" class="tab-panel"></div>
    <div id="tab-teams" class="tab-panel"></div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
<script>
const SHEET_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSWsAmfvCG1dfQZ9jxXKVkEtSxFD0Ad9OaOkszlICTMJRzIcOkMTLP1YFoy-4gzg5R1oXtPTmA9YgCl/pub?gid=2069986082&single=true&output=csv";
const GAMBLER_COLORS={Dave:"#dc2626",Kyle:"#2563eb",Lanny:"#059669",Zac:"#b45309",Hammen:"#c026d3",James:"#0891b2",Deva:"#7c3aed",Zim:"#4d7c0f"};
const TEAM_ALIASES={
  "St. John's":"St John's","St. John's (NY)":"St John's","St. John's Red Storm":"St John's",
  "San Diego State":"San Diego St","San Diego State Aztecs":"San Diego St",
  "Colorado State":"Colorado St","Colorado State Rams":"Colorado St",
  "Norfolk State":"Norfolk St","Norfolk State Spartans":"Norfolk St",
  "Utah State":"Utah St","Utah State Aggies":"Utah St",
  "Hawai'i Rainbow Warriors":"Hawai'i","Hawaii Rainbow Warriors":"Hawai'i","Hawaii":"Hawai'i",
  "Illinois State":"Illinois St","Illinois State Redbirds":"Illinois St",
  "Miami (OH) RedHawks":"Miami OH","Miami RedHawks":"Miami OH","Miami (OH)":"Miami OH",
  "Michigan State":"Michigan St","Michigan State Spartans":"Michigan St",
  "Kent State":"Kent St","Kent State Golden Flashes":"Kent St",
  "Iowa State":"Iowa St","Iowa State Cyclones":"Iowa St",
  "George Washington":"G Washington","George Washington Revolutionaries":"G Washington",
  "Saint Mary's (CA)":"Saint Mary's","Saint Mary's Gaels":"Saint Mary's",
  "UNC Wilmington":"NC Wilmington","UNC Wilmington Seahawks":"NC Wilmington","UNCW":"NC Wilmington",
  "Northern Iowa":"N Iowa","Northern Iowa Panthers":"N Iowa",
  "Ole Miss":"Mississippi","Ole Miss Rebels":"Mississippi","Mississippi Rebels":"Mississippi",
  "St. Thomas":"St Thomas","St. Thomas (MN)":"St Thomas","Saint Thomas":"St Thomas","St. Thomas Tommies":"St Thomas",
  "Connecticut":"UConn","UConn Huskies":"UConn",
  "Boise State":"Boise St","Boise State Broncos":"Boise St",
  "UC Santa Barbara":"UCSB","UC Santa Barbara Gauchos":"UCSB",
  "Little Rock Trojans":"Little Rock","Arkansas-Little Rock":"Little Rock","Arkansas State - Little Rock":"Little Rock",
};

const now=new Date();
const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
const shortMonths=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
document.getElementById("todayDate").textContent=`${dayNames[now.getDay()]}, ${monthNames[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

function dateToESPN(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`}
function formatDateLabel(d){
  const today=new Date();today.setHours(0,0,0,0);
  const cmp=new Date(d);cmp.setHours(0,0,0,0);
  const diff=Math.round((cmp-today)/864e5);
  let pfx=diff===0?"Today \u2014 ":diff===-1?"Yesterday \u2014 ":diff===1?"Tomorrow \u2014 ":"";
  return `${pfx}${dayNames[d.getDay()]}, ${shortMonths[d.getMonth()]} ${d.getDate()}`;
}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
  });
});

function parseCSV(t){
  const lines=t.trim().split("\n"),rows=[];
  for(let i=0;i<lines.length;i++){
    const parts=[];let cur="",inQ=false;
    for(let c=0;c<lines[i].length;c++){
      const ch=lines[i][c];
      if(ch==='"')inQ=!inQ;
      else if(ch===','&&!inQ){parts.push(cur.trim());cur="";}
      else cur+=ch;
    }
    parts.push(cur.trim());rows.push(parts);
  }
  return rows;
}
function processData(rows){
  let hIdx=0;
  for(let i=0;i<Math.min(rows.length,5);i++){
    if(rows[i].map(c=>c.toLowerCase()).some(c=>c.includes("gambler")||c.includes("team"))){hIdx=i;break;}
  }
  const data=[];
  for(let i=hIdx+1;i<rows.length;i++){
    const r=rows[i];if(!r[0]||!r[1])continue;
    const g=r[0].trim(),tm=r[1].trim(),w=parseInt(r[2])||0,l=parseInt(r[3])||0,pw=parseFloat(r[4])||0;
    if(g&&tm)data.push({gambler:g,team:tm,wins:w,losses:l,projWins:pw});
  }
  return data;
}

function getStandings(data){
  const m={};
  data.forEach(d=>{
    if(!m[d.gambler])m[d.gambler]={gambler:d.gambler,totalWins:0,totalLosses:0,totalProjWins:0};
    m[d.gambler].totalWins+=d.wins;m[d.gambler].totalLosses+=d.losses;m[d.gambler].totalProjWins+=d.projWins;
  });
  const a=Object.values(m).sort((a,b)=>b.totalWins-a.totalWins);
  a.forEach(s=>{
    s.payout=0;
    s.projPayout=0;
    a.forEach(o=>{
      if(o.gambler!==s.gambler){
        s.payout+=(s.totalWins-o.totalWins);
        s.projPayout+=(s.totalProjWins-o.totalProjWins);
      }
    });
  });
  return a;
}

function pctBadge(w,l,sm){
  const p=w/(w+l),c=p>=.75?"pct-good":p>=.5?"pct-mid":"pct-bad";
  const s=(p*100).toFixed(1)+"%";
  return `<span class="pct-badge ${sm?'sm':''} ${c}">${s}</span>`;
}
function moneyStr(p){
  if(p>0)return `<span class="val-payout pos">+$${p}</span>`;
  if(p<0)return `<span class="val-payout neg">\u2212$${Math.abs(p)}</span>`;
  return `<span class="val-payout zero">$0</span>`;
}
function projMoneyStr(p){
  const r=Math.round(p);
  if(r>0)return `<span class="val-payout pos">+$${r}</span>`;
  if(r<0)return `<span class="val-payout neg">\u2212$${Math.abs(r)}</span>`;
  return `<span class="val-payout zero">$0</span>`;
}
function colorName(g){return `<span style="color:${GAMBLER_COLORS[g]||'#1a1a1a'};font-weight:500">${g}</span>`}

let teamOwnerMap={};
function buildTeamOwnerMap(data){teamOwnerMap={};data.forEach(d=>{teamOwnerMap[d.team.toLowerCase()]=d.gambler;});}
function findOwner(name){
  if(!name)return null;
  const lo=name.toLowerCase();
  if(teamOwnerMap[lo])return teamOwnerMap[lo];
  const alias=TEAM_ALIASES[name];
  if(alias&&teamOwnerMap[alias.toLowerCase()])return teamOwnerMap[alias.toLowerCase()];
  for(const[k,v]of Object.entries(TEAM_ALIASES)){
    if(k.toLowerCase()===lo&&teamOwnerMap[v.toLowerCase()])return teamOwnerMap[v.toLowerCase()];
  }
  for(const k of Object.keys(teamOwnerMap)){
    if(lo.includes(k)||k.includes(lo))return teamOwnerMap[k];
  }
  return null;
}

/* ═══ ESPN ═══ */
let scheduleDate=new Date();scheduleDate.setHours(0,0,0,0);

async function fetchESPN(ds){
  try{
    const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?dates=${ds}&limit=400`);
    if(!r.ok)throw new Error();return(await r.json()).events||[];
  }catch(e){return null;}
}

function parseGames(evts){
  return evts.map(ev=>{
    const c=ev.competitions&&ev.competitions[0];if(!c)return null;
    const ts=c.competitors||[],aw=ts.find(t=>t.homeAway==="away"),hm=ts.find(t=>t.homeAway==="home");
    if(!aw||!hm)return null;
    const st=(c.status||{}).type||{},done=st.completed===true,live=st.state==="in",detail=st.shortDetail||"";
    let net="";if(c.broadcasts&&c.broadcasts.length>0)net=(c.broadcasts[0].names||[]).join(", ");
    const gd=new Date(ev.date);
    const time=gd.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"America/New_York"})+" ET";
    return{
      awayName:aw.team.displayName||aw.team.name,awayScore:parseInt(aw.score)||0,awayWinner:aw.winner===true,
      awayRank:aw.curatedRank&&aw.curatedRank.current<=25?aw.curatedRank.current:null,
      homeName:hm.team.displayName||hm.team.name,homeScore:parseInt(hm.score)||0,homeWinner:hm.winner===true,
      homeRank:hm.curatedRank&&hm.curatedRank.current<=25?hm.curatedRank.current:null,
      isCompleted:done,isLive:live,statusText:detail,network:net,timeStr:time
    };
  }).filter(Boolean);
}

function renderGames(games){
  const el=document.getElementById("scheduleGames");
  if(games===null){el.innerHTML=`<div class="no-games">\u26a0\ufe0f Could not load schedule from ESPN. Try refreshing.</div>`;return;}
  const sg=games.filter(g=>findOwner(g.awayName)||findOwner(g.homeName));
  if(!games.length){el.innerHTML=`<div class="no-games">No games scheduled for this day.</div>`;return;}
  if(!sg.length){el.innerHTML=`<div class="no-games">No stable teams playing this day. (${games.length} other games scheduled)</div>`;return;}
  sg.sort((a,b)=>{if(a.isLive!==b.isLive)return a.isLive?-1:1;if(a.isCompleted!==b.isCompleted)return a.isCompleted?1:-1;return 0;});
  let h=`<div class="game-count">${sg.length} stable game${sg.length!==1?'s':''} \u00b7 ${games.length} total games</div><div class="games-list">`;
  sg.forEach(g=>{
    const ao=findOwner(g.awayName),ho=findOwner(g.homeName),both=ao&&ho;
    const rb=r=>r?`<span style="color:#ca8a04">#${r} </span>`:"";
    let ac=ao?"game-team in-stable":"game-team not-stable";
    let hc=ho?"game-team in-stable":"game-team not-stable";
    let asc="#1a1a1a",hsc="#1a1a1a";
    if(g.isCompleted){asc=g.awayWinner?"#16a34a":"#aaa";hsc=g.homeWinner?"#16a34a":"#aaa";}
    h+=`<div class="game-card ${both?'stable-game':''}">`;
    h+=`<div style="text-align:right"><div class="${ac}">${rb(g.awayRank)}${g.awayName}</div>`;
    if(ao)h+=`<div class="game-owner" style="color:${GAMBLER_COLORS[ao]};text-align:right">${ao}</div>`;
    if(g.isCompleted||g.isLive)h+=`<div class="game-score" style="text-align:right;color:${asc}">${g.awayScore}</div>`;
    h+=`</div><div class="game-center">`;
    if(g.isCompleted){h+=`<div class="game-status-final">FINAL</div>`;if(g.statusText&&g.statusText.toLowerCase().includes("ot"))h+=`<div class="game-time">${g.statusText}</div>`;}
    else if(g.isLive){h+=`<div class="game-status-live">\u25cf LIVE</div><div class="game-time">${g.statusText}</div>`;}
    else{h+=`<div class="game-vs">VS</div><div class="game-time">${g.timeStr}</div>`;}
    if(g.network)h+=`<div class="game-network">${g.network}</div>`;
    h+=`</div><div><div class="${hc}">${rb(g.homeRank)}${g.homeName}</div>`;
    if(ho)h+=`<div class="game-owner" style="color:${GAMBLER_COLORS[ho]}">${ho}</div>`;
    if(g.isCompleted||g.isLive)h+=`<div class="game-score" style="color:${hsc}">${g.homeScore}</div>`;
    h+=`</div></div>`;
  });
  h+=`</div><div class="game-note">* Only games with stable teams shown. Stable vs. stable matchups have a red border.</div>`;
  el.innerHTML=h;
}

async function loadSchedule(d){
  document.getElementById("scheduleGames").innerHTML=`<div class="schedule-loading"><span class="mini-spinner"></span> Loading schedule...</div>`;
  document.getElementById("scheduleDate").textContent=formatDateLabel(d);
  document.getElementById("todayBtn").style.display=isSameDay(d,new Date())?"none":"inline-block";
  const evts=await fetchESPN(dateToESPN(d));
  renderGames(evts===null?null:parseGames(evts));
}
function changeDay(n){scheduleDate.setDate(scheduleDate.getDate()+n);loadSchedule(scheduleDate);}
function goToToday(){scheduleDate=new Date();scheduleDate.setHours(0,0,0,0);loadSchedule(scheduleDate);}

/* ═══ RENDER ═══ */
function renderStandings(data){
  const st=getStandings(data),c=document.getElementById("tab-standings");
  let h=`<div class="section-label">Current Standings</div><div class="card">`;
  h+=`<div class="tbl-header standings-grid"><div>#</div><div>Gambler</div><div class="text-center">Record</div><div class="text-right">Win%</div><div class="text-right">Current $</div><div class="text-right">Proj W</div><div class="text-right">Proj $</div></div>`;
  st.forEach((s,i)=>{
    const pct=s.totalWins/(s.totalWins+s.totalLosses);
    const pctStr=(pct*100).toFixed(1)+"%";
    h+=`<div class="tbl-row standings-grid"><div>${i+1}</div><div>${colorName(s.gambler)}</div><div class="text-center">${s.totalWins}-${s.totalLosses}</div><div class="text-right">${pctStr}</div><div class="text-right">${moneyStr(s.payout)}</div><div class="text-right">${s.totalProjWins.toFixed(1)}</div><div class="text-right">${projMoneyStr(s.projPayout)}</div></div>`;
  });
  h+=`</div>`;

  h+=`<div style="margin-top:28px"><div class="section-label">Stable Schedule</div>`;
  h+=`<div class="schedule-nav"><button class="nav-btn" onclick="changeDay(-1)">\u25c0 Prev</button><div><span class="nav-date" id="scheduleDate"></span><button class="nav-today-btn" id="todayBtn" onclick="goToToday()" style="display:none">TODAY</button></div><button class="nav-btn" onclick="changeDay(1)">Next \u25b6</button></div>`;
  h+=`<div id="scheduleGames"></div></div>`;
  c.innerHTML=h;loadSchedule(scheduleDate);
}

function renderStables(data){
  const st=getStandings(data),c=document.getElementById("tab-stables");let h="";
  st.forEach(s=>{
    const teams=data.filter(d=>d.gambler===s.gambler).sort((a,b)=>b.wins-a.wins);
    h+=`<div class="card stable-card"><div class="stable-header"><div class="stable-name">${colorName(s.gambler)}</div><div class="stable-stats"><div class="stable-stat"><div class="stable-stat-label">W-L</div><div class="stable-stat-val">${s.totalWins}-${s.totalLosses}</div></div><div class="stable-stat"><div class="stable-stat-label">Current $</div><div class="stable-stat-val">${moneyStr(s.payout)}</div></div><div class="stable-stat"><div class="stable-stat-label">Proj $</div><div class="stable-stat-val">${projMoneyStr(s.projPayout)}</div></div></div></div>`;
    h+=`<div class="stable-team-hdr"><div>Team</div><div class="text-center">Record</div><div class="text-right">Proj W</div></div>`;
    teams.forEach(t=>{
      h+=`<div class="stable-team-row"><div>${t.team}</div><div class="text-center">${t.wins}-${t.losses}</div><div class="text-right">${t.projWins}</div></div>`;
    });
    h+=`</div>`;
  });
  c.innerHTML=h;
}

let teamSortKey="wins",teamSortDir="desc",globalData=[];
function renderTeams(data){
  globalData=data;const c=document.getElementById("tab-teams");
  const sorted=[...data].sort((a,b)=>{
    switch(teamSortKey){
      case"team":return teamSortDir==="asc"?a.team.localeCompare(b.team):b.team.localeCompare(a.team);
      case"gambler":return teamSortDir==="asc"?a.gambler.localeCompare(b.gambler):b.gambler.localeCompare(a.gambler);
      case"wins":return teamSortDir==="asc"?a.wins-b.wins:b.wins-a.wins;
      case"projWins":return teamSortDir==="asc"?a.projWins-b.projWins:b.projWins-a.projWins;
      default:return b.wins-a.wins;
    }
  });
  const arrow=col=>teamSortKey!==col?`<span class="sort-arrow dim">\u2195</span>`:`<span class="sort-arrow">${teamSortDir==="asc"?"\u2191":"\u2193"}</span>`;
  let h=`<div class="section-label">All ${data.length} Teams \u2014 Click Headers to Sort</div><div class="card">`;
  h+=`<div class="tbl-header teams-grid"><div class="sortable" data-sort="team">Team ${arrow("team")}</div><div class="sortable" data-sort="gambler">Owner ${arrow("gambler")}</div><div class="sortable text-center" data-sort="wins">Record ${arrow("wins")}</div><div class="sortable text-right" data-sort="projWins">Proj W ${arrow("projWins")}</div></div>`;
  h+=`<div class="team-scroll">`;
  sorted.forEach(t=>{
    h+=`<div class="tbl-row teams-grid team-row"><div>${t.team}</div><div>${colorName(t.gambler)}</div><div class="text-center">${t.wins}-${t.losses}</div><div class="text-right">${t.projWins}</div></div>`;
  });
  h+=`</div></div>`;c.innerHTML=h;
  c.querySelectorAll(".sortable").forEach(el=>{
    el.addEventListener("click",()=>{
      const k=el.dataset.sort;
      if(teamSortKey===k)teamSortDir=teamSortDir==="asc"?"desc":"asc";
      else{teamSortKey=k;teamSortDir="desc";}
      renderTeams(globalData);
    });
  });
}

/* ═══ GOOGLE SHEETS FETCH ═══ */
const SHEET_ID="16AKVojcH_H1RmzEx4zHPJ_okEM5BVUbRh_ofptz_amw";
const SHEET_GID="2069986082";

function parseGvizResponse(text){
  const match=text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?\s*$/);
  if(!match)return null;
  const json=JSON.parse(match[1]);
  if(!json.table)return null;
  const data=[];
  json.table.rows.forEach(row=>{
    const cells=row.c;if(!cells||!cells[0]||!cells[1])return;
    const gambler=(cells[0]&&cells[0].v)?String(cells[0].v).trim():"";
    const team=(cells[1]&&cells[1].v)?String(cells[1].v).trim():"";
    const wins=(cells[2]&&cells[2].v)?parseInt(cells[2].v)||0:0;
    const losses=(cells[3]&&cells[3].v)?parseInt(cells[3].v)||0:0;
    const projWins=(cells[4]&&cells[4].v)?parseFloat(cells[4].v)||0:0;
    if(gambler&&team&&gambler.toLowerCase()!=="gambler")data.push({gambler,team,wins,losses,projWins});
  });
  return data;
}

/* JSONP approach — bypasses CORS completely by loading as a <script> tag */
function fetchViaJSONP(){
  return new Promise((resolve,reject)=>{
    const cbName="sheetCallback_"+Date.now();
    const timeout=setTimeout(()=>{delete window[cbName];reject(new Error("JSONP timeout"));},10000);
    window[cbName]=function(response){
      clearTimeout(timeout);delete window[cbName];
      try{
        if(!response.table){reject(new Error("No table in response"));return;}
        const data=[];
        response.table.rows.forEach(row=>{
          const cells=row.c;if(!cells||!cells[0]||!cells[1])return;
          const gambler=(cells[0]&&cells[0].v)?String(cells[0].v).trim():"";
          const team=(cells[1]&&cells[1].v)?String(cells[1].v).trim():"";
          const wins=(cells[2]&&cells[2].v)?parseInt(cells[2].v)||0:0;
          const losses=(cells[3]&&cells[3].v)?parseInt(cells[3].v)||0:0;
          const projWins=(cells[4]&&cells[4].v)?parseFloat(cells[4].v)||0:0;
          if(gambler&&team&&gambler.toLowerCase()!=="gambler")data.push({gambler,team,wins,losses,projWins});
        });
        resolve(data);
      }catch(e){reject(e);}
    };
    // Google's gviz endpoint supports a responseHandler param — this is true JSONP
    const script=document.createElement("script");
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&gid=${SHEET_GID}`;
    script.onerror=()=>{clearTimeout(timeout);delete window[cbName];reject(new Error("Script load failed"));};
    document.head.appendChild(script);
  });
}

/* Fallback: fetch with gviz JSON */
async function fetchViaGviz(){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`);
  if(!r.ok)throw new Error("gviz fetch failed");
  const text=await r.text();
  const d=parseGvizResponse(text);
  if(!d||!d.length)throw new Error("No data from gviz");
  return d;
}

/* Fallback: fetch published CSV */
async function fetchViaCSV(){
  const r=await fetch(SHEET_CSV_URL);
  if(!r.ok)throw new Error("CSV fetch failed");
  const d=processData(parseCSV(await r.text()));
  if(!d.length)throw new Error("No data from CSV");
  return d;
}

async function init(){
  const methods=[
    {name:"jsonp",fn:fetchViaJSONP},
    {name:"gviz",fn:fetchViaGviz},
    {name:"csv",fn:fetchViaCSV}
  ];
  let data=null,method="";
  for(const m of methods){
    try{data=await m.fn();method=m.name;break;}
    catch(e){console.log(m.name+" failed:",e.message);}
  }
  if(data&&data.length){
    document.getElementById("loading").style.display="none";
    buildTeamOwnerMap(data);renderStandings(data);renderStables(data);renderTeams(data);
    document.getElementById("lastUpdated").textContent=`Data loaded from Google Sheets (${method}) \u2022 ${new Date().toLocaleString()}`;
  }else{
    document.getElementById("loading").style.display="none";
    document.getElementById("error").style.display="block";
    document.getElementById("error").innerHTML=`<div class="error-box"><strong>\u26a0\ufe0f Could not load data</strong><br><br>All fetch methods failed.<br><br>
    1. Make sure the sheet is published: File \u2192 Share \u2192 Publish to web<br>
    2. Make sure the sheet is shared as "Anyone with the link can view"<br>
    3. Try refreshing the page</div>`;
  }
}
init();
