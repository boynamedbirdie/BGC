<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stable Tracker 2026-27 CBB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh;font-size:13px;font-weight:400;-webkit-font-smoothing:antialiased}
    .header{background:#fff;border-bottom:2px solid #e63946;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .header-title{font-size:20px}.header-sub{font-size:11px;color:#888;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
    .header-right{font-size:11px;color:#888;text-align:right}.header-right .accent{color:#e63946}
    .tabs{display:flex;border-bottom:1px solid #ddd;background:#fff;overflow-x:auto}
    .tab-btn{flex:0 0 auto;padding:11px 16px;border:none;background:transparent;color:#888;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
    .tab-btn.active{color:#1a1a1a;border-bottom-color:#e63946;background:#fafafa}.tab-btn:hover:not(.active){color:#555}
    .content{padding:16px 12px;max-width:960px;margin:0 auto}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .section-label{font-size:11px;color:#e63946;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
    .card{background:#fff;border-radius:8px;border:1px solid #e0e0e0;overflow:hidden;margin-bottom:14px}
    .tbl-header{display:grid;padding:8px 12px;background:#fafafa;border-bottom:1px solid #e0e0e0;font-size:10px;color:#888;letter-spacing:.5px;text-transform:uppercase}
    .tbl-row{display:grid;padding:8px 12px;border-bottom:1px solid #f0f0f0;align-items:center}.tbl-row:last-child{border-bottom:none}.tbl-row:hover{background:#fafafa}
    .text-right{text-align:right}.text-center{text-align:center}
    .val-payout.pos{color:#16a34a}.val-payout.neg{color:#dc2626}.val-payout.zero{color:#888}
    .alive{color:#16a34a}.elim{color:#dc2626}
    .conf-tag{font-size:10px;color:#888}
    .stable-team-hdr,.stable-team-row{display:grid;grid-template-columns:1fr 64px 56px 56px 56px 56px}
    .stable-team-hdr{padding:5px 14px;font-size:10px;color:#aaa;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #f0f0f0}
    .stable-team-row{padding:6px 14px;border-bottom:1px solid #f5f5f5;align-items:center}.stable-team-row:last-child{border-bottom:none}
    .teams-grid{grid-template-columns:1fr 64px 60px 56px 56px 56px 56px}
    .stable-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e0e0e0}
    .stable-name{font-size:15px}.stable-stats{display:flex;gap:14px}.stable-stat{text-align:right}
    .stable-stat-label{font-size:9px;color:#888;letter-spacing:.5px;text-transform:uppercase}.stable-stat-val{font-size:13px}
    .schedule-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
    .nav-btn{background:#fff;border:1px solid #ddd;color:#555;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px}
    .nav-btn:hover{background:#f5f5f5;border-color:#bbb}
    .nav-date{font-size:14px;min-width:190px;text-align:center}
    .nav-today-btn{background:transparent;border:1px solid #e6394644;color:#e63946;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;font-size:10px;margin-left:4px}
    .games-list{display:flex;flex-direction:column;gap:8px}

    .game-card.stable-game{border-color:#e63946;border-width:1.5px}
    .game-team{font-size:13px}.game-team.in-stable{color:#1a1a1a}.game-team.not-stable{color:#aaa}
    .game-owner{font-size:10px;margin-top:2px}.game-score{font-size:14px;margin-top:3px}
    .game-center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
    .game-vs{font-size:10px;color:#e63946;letter-spacing:1px}.game-time{font-size:10px;color:#888}
    .game-status-final{font-size:10px;color:#16a34a}.game-status-live{font-size:10px;color:#e63946;animation:pulse 1.5s ease-in-out infinite}

    .game-network{font-size:9px;color:#888;background:#f5f5f5;padding:2px 6px;border-radius:4px}
    .game-note{margin-top:8px;font-size:10px;color:#aaa;font-style:italic}
    .sb-badge{font-size:9px;color:#b45309;background:#fef3c7;padding:2px 6px;border-radius:4px;margin-top:2px;white-space:nowrap}
    .bet-card{background:#fff;border-radius:8px;border:1px solid #e0e0e0;padding:12px 14px;margin-bottom:8px}
    .bet-card.on{border-color:#16a34a}
    .bet-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
    .bet-meta{font-size:11px;color:#888}
    .bet-sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .bet-side{background:#fafafa;border-radius:6px;padding:8px 10px}
    .bet-side .who{font-size:11px;margin-top:2px}
    .btn-in{margin-top:6px;background:#16a34a;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer}

    .me-bar{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .link-btn{background:none;border:none;color:#2563eb;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;padding:0}
    .game-count{font-size:11px;color:#888;text-align:center;margin-bottom:10px}
    .no-games{background:#fff;border-radius:8px;border:1px solid #e0e0e0;padding:24px;text-align:center;color:#888}
    .schedule-loading{text-align:center;padding:20px;color:#888;font-size:12px}
    .mini-spinner{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#e63946;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
    .sortable{cursor:pointer;user-select:none}.sortable:hover{color:#555}
    .sort-arrow{font-size:10px}.sort-arrow.dim{opacity:.25}
    .team-scroll{max-height:600px;overflow-y:auto}.team-row:nth-child(even){background:#fafafa}
    .loading{text-align:center;padding:50px 20px;color:#888}
    .loading .spinner{display:inline-block;width:28px;height:28px;border:3px solid #ddd;border-top-color:#e63946;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-box{background:#fee2e2;border:1px solid #dc2626;border-radius:8px;padding:16px;font-size:13px;line-height:1.5}
    .last-updated{text-align:center;font-size:10px;color:#aaa;padding:10px;margin-top:16px}
    .progress-bar{width:100%;height:4px;background:#e0e0e0;border-radius:2px;margin-top:8px;overflow:hidden}
    .progress-fill{height:100%;background:#e63946;border-radius:2px;transition:width .3s}
    @media(max-width:600px){
      body{font-size:12px}.header{padding:12px}.header-title{font-size:17px}.content{padding:12px 6px}

      .stable-team-hdr,.stable-team-row{grid-template-columns:1fr 48px 46px 46px 46px 46px}
      .teams-grid{grid-template-columns:1fr 48px 52px 44px 44px 44px 44px}

      .schedule-nav{gap:4px}.nav-date{font-size:12px;min-width:130px}.nav-btn{padding:5px 8px;font-size:11px}
      .game-card{padding:8px 10px;gap:5px}.game-team{font-size:11px}

    /* ===== History tab ===== */
    #tab-history table{width:100%;border-collapse:collapse}

    #tab-history .r{text-align:right}
    #tab-history .c{text-align:center}
    #tab-history .muted{color:#888}
    #tab-history .small{font-size:11px}
    #tab-history .pos{color:#16a34a}
    #tab-history .neg{color:#dc2626}
    #tab-history .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
    #tab-history .crown{color:#d97706;font-size:11px;margin-left:4px}
    #tab-history .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    #tab-history .pill{background:#fff;border:1px solid #ddd;color:#555;padding:5px 10px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:12px}
    #tab-history .pill.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
    #tab-history .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
    #tab-history .stat{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px}
    #tab-history .stat-l{font-size:9px;color:#888;letter-spacing:.5px;text-transform:uppercase}
    #tab-history .stat-v{font-size:18px;margin-top:3px}
    #tab-history .stat-s{font-size:11px;color:#888;margin-top:2px}
    #tab-history .stables{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    #tab-history .stable-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1px solid #e0e0e0}
    #tab-history .stable-name{font-size:15px}
    #tab-history .trow{display:flex;justify-content:space-between;padding:5px 12px;border-bottom:1px solid #f5f5f5}
    #tab-history .trow:last-child{border-bottom:none}
    #tab-history .scroll{overflow-x:auto}
    #tab-history .chart-wrap{padding:10px 8px 4px}
    #tab-history .legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 12px 10px;font-size:11px}
    #tab-history .legend span{cursor:pointer;user-select:none}
    #tab-history .legend span.off{opacity:.3}
    #tab-history .toggle{display:flex;gap:6px;padding:10px 12px 0}
    #tab-history .note{font-size:11px;color:#888;margin:-6px 0 14px}
    #tab-history .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
    #tab-history td,#tab-history th{padding:6px 7px}
    #tab-history .h-nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    #tab-history .h-sub{display:none}#tab-history .h-sub.active{display:block}
    @media(max-width:600px){#tab-history td,#tab-history th{padding:6px 7px}}
  </style>
</head>
<body>
  <div class="header">
    <div><div class="header-title">&#x1F3C0; Stable Tracker</div><div class="header-sub">2026-27 College Basketball &middot; 8 Gamblers &middot; 64 Teams</div></div>
    <div class="header-right"><div id="todayDate"></div><div class="accent">$1 per win per opponent</div></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="standings">Standings &amp; Schedule</button>
    <button class="tab-btn" data-tab="stables">Stables</button>
    <button class="tab-btn" data-tab="teams">Team Data</button>
    <button class="tab-btn" data-tab="sidebets">Eschoons</button>
    <button class="tab-btn" data-tab="history">History</button>
  </div>
  <div class="content">
    <div id="loading" class="loading"><div class="spinner"></div><div>Loading team data from ESPN...</div><div id="loadProgress" style="font-size:11px;margin-top:6px;color:#aaa"></div><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></div>
    <div id="error" style="display:none"></div>
    <div id="tab-standings" class="tab-panel active"></div>
    <div id="tab-stables" class="tab-panel"></div>
    <div id="tab-teams" class="tab-panel"></div>
    <div id="tab-sidebets" class="tab-panel"></div>

      <div class="h-nav">
        <button class="pill active" data-sub="alltime">All-Time</button>
        <button class="pill" data-sub="seasons">Seasons</button>
        <button class="pill" data-sub="players">Players</button>
        <button class="pill" data-sub="records">Records</button>
      </div>
      <div class="h-sub active" id="h-alltime"></div>
      <div class="h-sub" id="h-seasons"></div>
      <div class="h-sub" id="h-players"></div>
      <div class="h-sub" id="h-records"></div>
    </div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
<script>
/* =====================================================================
   SEASON SETUP — the only section that needs editing each year
   ===================================================================== */

// Gambler name colors
var GC={Zac:"#b45309",Deva:"#7c3aed",Findley:"#0891b2",Hammen:"#c026d3",Kyle:"#2563eb",Lanny:"#059669",Zim:"#4d7c0f",David:"#dc2626"};

// The draft: gambler, team name as shown on the site, ESPN team ID, conference.
// Find an ESPN ID in the team's URL: espn.com/mens-college-basketball/team/_/id/XXXX/
var ST=[
  {g:"Zac",t:"Duke",id:150,conf:"ACC"},{g:"Zac",t:"Texas",id:251,conf:"SEC"},
  {g:"Zac",t:"Alabama",id:333,conf:"SEC"},{g:"Zac",t:"VCU",id:2670,conf:"A-10"},
  {g:"Zac",t:"Murray St",id:93,conf:"MVC"},{g:"Zac",t:"Michigan",id:130,conf:"Big Ten"},
  {g:"Zac",t:"St. Thomas",id:2900,conf:"Summit"},{g:"Zac",t:"Colorado St",id:36,conf:"Pac-12"},

  {g:"Deva",t:"Florida",id:57,conf:"SEC"},{g:"Deva",t:"Michigan St",id:127,conf:"Big Ten"},
  {g:"Deva",t:"Furman",id:231,conf:"SoCon"},{g:"Deva",t:"W Kentucky",id:98,conf:"CUSA"},
  {g:"Deva",t:"Utah St",id:328,conf:"Pac-12"},{g:"Deva",t:"Texas Tech",id:2641,conf:"Big 12"},
  {g:"Deva",t:"Howard",id:47,conf:"MEAC"},{g:"Deva",t:"Virginia Tech",id:259,conf:"ACC"},

  {g:"Findley",t:"Gonzaga",id:2250,conf:"Pac-12"},{g:"Findley",t:"UConn",id:41,conf:"Big East"},
  {g:"Findley",t:"St. Mary's",id:2608,conf:"WCC"},{g:"Findley",t:"Tennessee",id:2633,conf:"SEC"},
  {g:"Findley",t:"UC San Diego",id:28,conf:"Big West"},{g:"Findley",t:"Purdue",id:2509,conf:"Big Ten"},
  {g:"Findley",t:"Long Island U",id:112358,conf:"NEC"},{g:"Findley",t:"Wright St",id:2750,conf:"Horizon"},

  {g:"Hammen",t:"Illinois",id:356,conf:"Big Ten"},{g:"Hammen",t:"Saint Louis",id:139,conf:"A-10"},
  {g:"Hammen",t:"St. John's",id:2599,conf:"Big East"},{g:"Hammen",t:"Tennessee St",id:2634,conf:"OVC"},
  {g:"Hammen",t:"UCLA",id:26,conf:"Big Ten"},{g:"Hammen",t:"Vermont",id:261,conf:"Am East"},
  {g:"Hammen",t:"Ohio St",id:194,conf:"Big Ten"},{g:"Hammen",t:"Kentucky",id:96,conf:"SEC"},

  {g:"Kyle",t:"Houston",id:248,conf:"Big 12"},{g:"Kyle",t:"Virginia",id:258,conf:"ACC"},
  {g:"Kyle",t:"Nebraska",id:158,conf:"Big Ten"},{g:"Kyle",t:"Akron",id:2006,conf:"MAC"},
  {g:"Kyle",t:"Dayton",id:2168,conf:"A-10"},{g:"Kyle",t:"Montana St",id:147,conf:"Big Sky"},
  {g:"Kyle",t:"Oklahoma",id:201,conf:"SEC"},{g:"Kyle",t:"James Madison",id:256,conf:"Sun Belt"},

  {g:"Lanny",t:"High Point",id:2272,conf:"Big South"},{g:"Lanny",t:"Iowa St",id:66,conf:"Big 12"},
  {g:"Lanny",t:"Miami FL",id:2390,conf:"ACC"},{g:"Lanny",t:"Vanderbilt",id:238,conf:"SEC"},
  {g:"Lanny",t:"New Mexico",id:167,conf:"MWC"},{g:"Lanny",t:"Illinois Chicago",id:82,conf:"MVC"},
  {g:"Lanny",t:"SFA",id:2617,conf:"Southland"},{g:"Lanny",t:"George Mason",id:2244,conf:"A-10"},

  {g:"Zim",t:"Grand Canyon",id:2253,conf:"MWC"},{g:"Zim",t:"McNeese",id:2377,conf:"Southland"},
  {g:"Zim",t:"UC Santa Barbara",id:2540,conf:"Big West"},{g:"Zim",t:"Wichita St",id:2724,conf:"American"},
  {g:"Zim",t:"Miami OH",id:193,conf:"MAC"},{g:"Zim",t:"Arkansas",id:8,conf:"SEC"},
  {g:"Zim",t:"Santa Clara",id:2541,conf:"WCC"},{g:"Zim",t:"NC State",id:152,conf:"ACC"},

  {g:"David",t:"Arizona",id:12,conf:"Big 12"},{g:"David",t:"UNC Wilmington",id:350,conf:"CAA"},
  {g:"David",t:"Louisville",id:97,conf:"ACC"},{g:"David",t:"Nevada",id:2440,conf:"MWC"},
  {g:"David",t:"UC Irvine",id:300,conf:"Big West"},{g:"David",t:"Texas A&M",id:245,conf:"SEC"},
  {g:"David",t:"Charleston",id:232,conf:"CAA"},{g:"David",t:"Marquette",id:269,conf:"Big East"}
];

// Conference tournament first-game and championship-game dates ("YYYY-MM-DD").
// Leave as null until confirmed. While a start date is null, every game counts as regular season.
// The "Conf T Alive" column appears on its own once any start date has arrived, and hides again after every end date has passed.
var CONF={
  "A-10":{start:null,end:null},"ACC":{start:null,end:null},"Am East":{start:null,end:null},
  "American":{start:null,end:null},"Big 12":{start:null,end:null},"Big East":{start:null,end:null},
  "Big Sky":{start:null,end:null},"Big South":{start:null,end:null},"Big Ten":{start:null,end:null},
  "Big West":{start:null,end:null},"CAA":{start:null,end:null},"CUSA":{start:null,end:null},
  "Horizon":{start:null,end:null},"MAC":{start:null,end:null},"MEAC":{start:null,end:null},
  "MVC":{start:null,end:null},"MWC":{start:null,end:null},"NEC":{start:null,end:null},
  "OVC":{start:null,end:null},"Pac-12":{start:"2027-03-09",end:null},"SEC":{start:null,end:null},
  "SoCon":{start:null,end:null},"Southland":{start:null,end:null},"Summit":{start:null,end:null},
  "Sun Belt":{start:null,end:null},"WCC":{start:null,end:null}
};

// First day of the postseason tournaments (NCAA, NIT, Crown). Every game on or after this date counts as postseason.
// Leave null until the schedule is set.
var POST_START=null;

// Projected wins come from TeamRankings (copied daily into projections.json by a GitHub job).
// Only teams whose TeamRankings name differs from the name above need an entry here.
var TR_NAME={"St. Thomas":"St Thomas","St. Mary's":"Saint Mary's","UC San Diego":"UCSD","Long Island U":"LIU",
  "St. John's":"St John's","Miami FL":"Miami","James Madison":"J Madison","UC Santa Barbara":"UCSB",
  "SFA":"SF Austin","UNC Wilmington":"NC Wilmington"};

// $5 eschoons: paste the web-app address of the eschoons Google Sheet script here (leave "" to hide the feature).
var SIDEBET_URL="https://script.google.com/macros/s/AKfycbxCCPHSpVmLBLngdrYNJsWrMm__cx-_1ix9BTBSLNIacNLEthQA7rqzTMf_TMmC5_KmOg/exec";

/* ===================================================================== */

function dt(s,h){return s?new Date(s+"T"+(h||"00:00")+":00"):null;}
var now=new Date();
var postStart=dt(POST_START,"00:00");
var postOn=!!(postStart&&now>=postStart);
var dN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],mN=["January","February","March","April","May","June","July","August","September","October","November","December"],mS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
document.getElementById("todayDate").textContent=dN[now.getDay()]+", "+mN[now.getMonth()]+" "+now.getDate()+", "+now.getFullYear();
document.querySelectorAll(".tab-btn").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active")});document.querySelectorAll(".tab-panel").forEach(function(x){x.classList.remove("active")});b.classList.add("active");document.getElementById("tab-"+b.dataset.tab).classList.add("active")})});
function cn(g){return '<span style="color:'+(GC[g]||'#1a1a1a')+';font-weight:500">'+g+'</span>';}
function ms(p){if(p>0)return '<span class="val-payout pos">+$'+p+'</span>';if(p<0)return '<span class="val-payout neg">−$'+Math.abs(p)+'</span>';return '<span class="val-payout zero">$0</span>';}

// Owner lookup by ESPN team ID (used by the schedule, so name variants never matter)
var OWN={},NAME={};ST.forEach(function(x){OWN[x.id]=x.g;NAME[x.id]=x.t;});
function compId(c){return parseInt((c.team&&c.team.id)||c.id)||0;}

// Is the conference-tournament window open right now (any conference)?
var confWindowOn=Object.keys(CONF).some(function(k){
  var s=dt(CONF[k].start,"00:00"),e=dt(CONF[k].end,"23:59");

var anyConfStarted=Object.keys(CONF).some(function(k){var s=dt(CONF[k].start,"00:00");return s&&now>=s;});

async function fetchOne(st){
  var eid=st.id,cf=CONF[st.conf]||{};
  var cStart=dt(cf.start,"12:00"),cEnd=dt(cf.end,"23:59");
  var confStarted=!!(cStart&&now>=dt(cf.start,"00:00"));
  var tW=0,tL=0;
  try{var r=await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/"+eid);
    if(r.ok){var j=await r.json(),tm=j.team;if(tm&&tm.record&&tm.record.items&&tm.record.items[0]){var p=(tm.record.items[0].summary||"").split("-");if(p.length>=2){tW=parseInt(p[0])||0;tL=parseInt(p[1])||0;}}}
  }catch(e){}
  var rW=0,rL=0,pW=0,pL=0,sW=0,sL=0,inP=false,pElim=false;
  try{var r2=await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/"+eid+"/schedule");
    if(r2.ok){var j2=await r2.json(),ev=j2.events||[];
      for(var i=0;i<ev.length;i++){
        var e=ev[i],co=e.competitions&&e.competitions[0];if(!co)continue;
        var gd=new Date(e.date),stt=co.status&&co.status.type,done=stt&&stt.completed;
        var us=null;for(var k=0;k<(co.competitors||[]).length;k++){if(compId(co.competitors[k])===eid){us=co.competitors[k];break;}}
        var won=!!(us&&us.winner===true);
        if(done&&us){if(won)sW++;else sL++;}
        if(postStart&&gd>=postStart){
          inP=true; // scheduled or played = in the postseason
          if(done&&us){if(won)pW++;else{pL++;pElim=true;}}
        }else if(!cStart||gd<cStart){
          if(done&&us){if(won)rW++;else rL++;}
        }
      }
    }
  }catch(e){}
  if(tW+tL===0){tW=sW;tL=sL;} // fallback if the record call failed
  var cW=0,cL=0;
  if(confStarted){cW=Math.max(0,tW-rW-pW);cL=Math.max(0,tL-rL-pL);}
  else{rW=Math.max(0,tW-pW);rL=Math.max(0,tL-pL);}
  // Conference tournament status: null (not started), "alive", "out" (lost), "done" (won it / tourney over)
  var cStatus=null;
  if(confStarted){
    if(cL>0)cStatus="out";
    else if(cEnd&&now>cEnd)cStatus="done";
    else cStatus="alive";
  }
  return{gambler:st.g,team:st.t,espnId:eid,conf:st.conf,totalW:tW,totalL:tL,regW:rW,regL:rL,confTW:cW,confTL:cL,postW:pW,postL:pL,
    confStarted:confStarted,inConf:(cW+cL)>0,cStatus:cStatus,postElim:pElim,inPost:inP};
}
async function fetchAll(){

}

function fD(d){var t=new Date();t.setHours(0,0,0,0);var c=new Date(d);c.setHours(0,0,0,0);var df=Math.round((c-t)/864e5);var p=df===0?"Today — ":df===-1?"Yesterday — ":df===1?"Tomorrow — ":"";return p+dN[d.getDay()]+", "+mS[d.getMonth()]+" "+d.getDate();}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function parseSpread(co,aw,hm){
  if(!co.odds||!co.odds.length)return{spread:null,favHome:null};
  var o=co.odds[0],sp=null,fh=null;
  if(o.awayTeamOdds&&o.awayTeamOdds.favorite===true)fh=false;
  else if(o.homeTeamOdds&&o.homeTeamOdds.favorite===true)fh=true;
  if(o.spread!==undefined&&o.spread!==null){var v=parseFloat(o.spread);if(!isNaN(v)&&v!==0){sp=Math.abs(v);if(fh===null)fh=v<0;}}
  if(sp===null&&o.details){var m=o.details.match(/(-?\d+\.?\d*)\s*$/);if(m){var vv=parseFloat(m[1]);if(!isNaN(vv)&&vv!==0){sp=Math.abs(vv);if(fh===null){var dl=o.details.toLowerCase(),ab=(aw.team.abbreviation||"").toLowerCase();fh=!(ab&&dl.indexOf(ab)===0);}}}}
  return{spread:sp,favHome:fh};
}

function getSt(td){
  var m={};td.forEach(function(t){
    var s=m[t.gambler]||(m[t.gambler]={g:t.gambler,w:0,l:0,ca:0,pa:0,rW:0,rL:0,cW:0,cL:0,pW:0,pL:0,pj:0,pjMissing:0});
    s.w+=t.totalW;s.l+=t.totalL;s.rW+=t.regW;s.rL+=t.regL;s.cW+=t.confTW;s.cL+=t.confTL;s.pW+=t.postW;s.pL+=t.postL;
    if(t.projW!==null)s.pj+=t.projW;else s.pjMissing++;
    if(t.cStatus==="alive"||(!t.confStarted&&confWindowOn))s.ca++;
    if(t.inPost&&!t.postElim)s.pa++;
  });
  var a=Object.values(m).sort(function(a,b){return b.w-a.w;});
  a.forEach(function(s){s.pay=0;s.ppay=0;a.forEach(function(o){if(o.g!==s.g){s.pay+=(s.w-o.w);s.ppay+=(s.pj-o.pj);}});s.ppay=Math.round(s.ppay);});return a;
}
var anyProj=function(td){return td.some(function(t){return t.projW!==null;});};
function pjCell(v){return v===null||v===undefined?"—":v.toFixed(1);}

  if(SB.error)h+='<div class="sb-msg err">'+SB.error+'</div>';
  var open=SB.bets.filter(function(b){var s=sbStatus(b);return s==="Offered"||s==="On";}).sort(function(a,b){return new Date(a.tipoff)-new Date(b.tipoff);});
  h+='<div class="section-label">Open Eschoons</div>';
  if(!open.length)h+='<div class="no-games" style="margin-bottom:14px">No open eschoons. Each morning around 7 AM Central, any game between two stables with a line of '+SB.maxLine+' or less is offered here.</div>';
  open.forEach(function(b){
    var s=sbStatus(b),before=new Date()<new Date(b.tipoff);
    var side=function(team,owner,inAt){
      var x='<div class="bet-side"><div>'+team+'</div><div class="who">'+cn(owner)+' &middot; '+(inAt?'<span class="alive">&#10003; In</span>':'<span style="color:#888">Waiting</span>')+'</div>';
      if(!inAt&&before&&SB.me===owner)x+='<button class="btn-in" onclick="acceptBet(\''+b.id+'\',this)">I\'m in for $'+SB.stake+'</button>';
      return x+'</div>';
    };
    h+='<div class="bet-card'+(s==="On"?' on':'')+'"><div class="bet-top"><div>'+b.away+' @ '+b.home+'</div><div class="bet-meta">'+fmtTip(b.tipoff)+' &middot; Line at 7 AM: '+(b.line||'—')+'</div></div>';
    h+='<div class="bet-meta" style="margin-top:4px">'+(s==="On"?'<span class="alive">Eschoon is on: $'+SB.stake+', straight up</span>':'Both players must be in before tip-off')+'</div>';
    h+='<div class="bet-sides">'+side(b.away,b.awayOwner,b.awayIn)+side(b.home,b.homeOwner,b.homeIn)+'</div></div>';
  });
  // Ledger
  var L={};Object.keys(GC).forEach(function(g){L[g]={g:g,w:0,l:0,net:0};});
  SB.bets.forEach(function(b){
    if(sbStatus(b)!=="Settled"||!b.winner)return;
    var loser=b.winner===b.awayOwner?b.homeOwner:b.awayOwner;
    if(L[b.winner]){L[b.winner].w++;L[b.winner].net+=SB.stake;}
    if(L[loser]){L[loser].l++;L[loser].net-=SB.stake;}
  });
  var lg=Object.values(L).sort(function(a,b){return b.net-a.net||b.w-a.w;});
  var gcols="grid-template-columns:24px 1fr 80px 70px";
  h+='<div class="section-label" style="margin-top:20px">Eschoon Ledger</div><div class="card"><div class="tbl-header" style="'+gcols+'"><div>#</div><div>Gambler</div><div class="text-center">W-L</div><div class="text-right">Net $</div></div>';
  lg.forEach(function(s,i){h+='<div class="tbl-row" style="'+gcols+'"><div>'+(i+1)+'</div><div>'+cn(s.g)+'</div><div class="text-center">'+s.w+'-'+s.l+'</div><div class="text-right">'+ms(s.net)+'</div></div>';});
  h+='</div>';
  // Who owes whom: net each pair of players so there's one payment per pair
  var P={};
  SB.bets.forEach(function(b){
    if(sbStatus(b)!=="Settled"||!b.winner)return;
    var loser=b.winner===b.awayOwner?b.homeOwner:b.awayOwner;
    var k=[b.winner,loser].sort().join("|");
    P[k]=P[k]||{a:k.split("|")[0],b:k.split("|")[1],aNet:0,games:0};
    P[k].aNet+=(b.winner===P[k].a?SB.stake:-SB.stake);P[k].games++;
  });
  var debts=Object.values(P).filter(function(p){return p.aNet!==0;}).map(function(p){
    return p.aNet>0?{from:p.b,to:p.a,amt:p.aNet,games:p.games}:{from:p.a,to:p.b,amt:-p.aNet,games:p.games};
  }).sort(function(x,y){return y.amt-x.amt||x.from.localeCompare(y.from);});
  h+='<div class="section-label" style="margin-top:20px">Who Owes Whom</div>';
  if(!debts.length)h+='<div class="no-games">'+(Object.keys(P).length?'Everyone is square.':'No eschoons have been settled yet.')+'</div>';
  else{
    var oc="grid-template-columns:1fr 70px 60px";
    h+='<div class="card"><div class="tbl-header" style="'+oc+'"><div>Payment</div><div class="text-center">Eschoons</div><div class="text-right">Amount</div></div>';
    debts.forEach(function(d){h+='<div class="tbl-row" style="'+oc+'"><div>'+cn(d.from)+' owes '+cn(d.to)+'</div><div class="text-center">'+d.games+'</div><div class="text-right">$'+d.amt+'</div></div>';});
    h+='</div>';
  }
  // History
  var past=SB.bets.filter(function(b){var s=sbStatus(b);return s!=="Offered"&&s!=="On";}).sort(function(a,b){return new Date(b.tipoff)-new Date(a.tipoff);});
  h+='<div class="section-label" style="margin-top:20px">History</div>';
  if(!past.length)h+='<div class="no-games">No finished eschoons yet.</div>';
  else{
    var hc="grid-template-columns:90px 1fr 110px";
    h+='<div class="card"><div class="tbl-header" style="'+hc+'"><div>Date</div><div>Game</div><div class="text-right">Result</div></div>';
    past.forEach(function(b){
      var s=sbStatus(b),d=new Date(b.tipoff),res;
      if(s==="Settled")res=b.winner?cn(b.winner)+' won':'Settled';
      else if(s==="Void")res='<span style="color:#888">Void</span>';
      else res='<span style="color:#888">Not taken</span>';
      h+='<div class="tbl-row" style="'+hc+'"><div class="bet-meta">'+mS[d.getMonth()]+' '+d.getDate()+'</div><div>'+b.away+' ('+cn(b.awayOwner)+') @ '+b.home+' ('+cn(b.homeOwner)+')'+(b.note&&s==="Settled"?'<div class="bet-meta">'+b.note+'</div>':'')+'</div><div class="text-right">'+res+'</div></div>';
    });
    h+='</div>';
  }
  c.innerHTML=h;
}

function sortAT(k){atSort=atSort.k===k?{k:k,d:-atSort.d}:{k:k,d:(k==="name"||k==="avgRank")?1:-1};renderAllTime();}
function chart(){
  var W=920,H=300,L=44,R=24,T=12,B=30,iw=W-L-R,ih=H-T-B,ys=DONE;
  var series=PL.filter(function(n){return !hidden[n];}).map(function(n){
    var cum=0,pts=[];
    ys.forEach(function(y,i){var p=S[y].g[n];if(!p){if(chartMode==="cum"&&cum&&P[n].hist[0].y<y){}return;}
      cum+=p.pay;pts.push({i:i,v:chartMode==="wins"?p.w:chartMode==="rank"?p.rank:cum});});
    return {n:n,pts:pts};});
  var vals=[];series.forEach(function(s){s.pts.forEach(function(p){vals.push(p.v);});});
  if(!vals.length)return '<div class="muted small" style="padding:20px">Pick a gambler below.</div>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(chartMode==="rank"){mn=1;mx=8;}else{var pad=(mx-mn)*.08||5;mn=Math.floor(mn-pad);mx=Math.ceil(mx+pad);if(chartMode==="cum"){mn=Math.min(mn,0);mx=Math.max(mx,0);}}
  function X(i){return L+(ys.length===1?iw/2:i*iw/(ys.length-1));}
  function Y(v){var t=(v-mn)/(mx-mn||1);return chartMode==="rank"?T+t*ih:T+ih-t*ih;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" font-family="Inter,sans-serif" font-size="10">';
  var ticks=chartMode==="rank"?[1,2,3,4,5,6,7,8]:niceTicks(mn,mx);
  ticks.forEach(function(t){var y=Y(t);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="'+(t===0&&chartMode==="cum"?'#bbb':'#eee')+'"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end" fill="#999">'+(chartMode==="cum"?(t<0?'-$':'$')+Math.abs(t):chartMode==="rank"?ord(t):t)+'</text>';});
  ys.forEach(function(y,i){if(ys.length>10&&i%2&&i!==ys.length-1)return;s+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" fill="#999">'+y.slice(2)+'</text>';});
  series.forEach(function(se){var c=col(se.n),d="";
    se.pts.forEach(function(p,k){var prev=se.pts[k-1];d+=(k&&prev.i===p.i-1?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1);});
    s+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/>';
    se.pts.forEach(function(p){s+='<circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" fill="'+c+'"><title>'+se.n+' '+ys[p.i]+': '+(chartMode==="rank"?ord(p.v):chartMode==="cum"?'$'+p.v:p.v+' wins')+'</title></circle>';});});
  return s+'</svg>';
}
function niceTicks(a,b){var span=b-a,step=Math.pow(10,Math.floor(Math.log10(span/5)));[1,2,5,10].some(function(m){if(span/(step*m)<=6){step*=m;return true;}});var t=[];for(var v=Math.ceil(a/step)*step;v<=b;v+=step)t.push(Math.round(v));return t;}

function renderPlayers(){
  var h='<div class="pills">'+PL.map(function(n){return '<button class="pill'+(n===selP?' active':'')+'" onclick="HIST.player(\''+n+'\')">'+n+'</button>';}).join("")+'</div>';
  var a=P[selP],picks=[],teams={};
  a.hist.forEach(function(s){s.teams.forEach(function(t){picks.push({t:t.team,w:t.w,y:s.y,pick:t.pick});var k=t.team;(teams[k]=teams[k]||{t:k,n:0,w:0,ys:[]});teams[k].n++;teams[k].w+=t.w;teams[k].ys.push(s.y.slice(2));});});
  var firsts=picks.filter(function(p){return p.pick===1;});
  h+='<div class="stats">'+
    stat("All-time $",money(a.pay),a.seasons+" seasons")+
    stat("Titles",a.titles,a.top3+" top-3 finishes")+
    stat("Avg wins",fmt1(a.fs?a.fw/a.fs:0),"avg finish "+fmt1(a.rankSum/a.seasons))+
    stat("Best season",a.best.w+" wins",a.best.y)+
    stat("Worst season",a.worst.w+" wins",a.worst.y)+
    stat("1st-round picks",fmt1(firsts.reduce(function(x,p){return x+p.w;},0)/firsts.length),"avg wins")+'</div>';
  h+='<div class="section-label">Season by season</div><div class="card scroll"><table><thead><tr><th>Season</th><th class="r">Wins</th><th class="r">Finish</th><th class="r">Payout</th><th>Best team</th><th>Worst team</th></tr></thead><tbody>';
  a.hist.slice().reverse().forEach(function(s){var srt=s.teams.slice().sort(function(x,y){return y.w-x.w;});
    h+='<tr style="cursor:pointer" onclick="HIST.open(\''+s.y+'\')"><td>'+s.y+'</td><td class="r">'+s.w+'</td><td class="r">'+ord(s.rank)+' <span class="muted small">of '+s.n+'</span>'+(s.rank===1?crown():'')+'</td><td class="r">'+money(s.pay)+'</td><td>'+srt[0].team+' <span class="muted">('+srt[0].w+')</span></td><td>'+srt[srt.length-1].team+' <span class="muted">('+srt[srt.length-1].w+')</span></td></tr>';});
  h+='</tbody></table></div><div class="note">Click a season to see every stable that year.</div>';
  var tl=Object.keys(teams).map(function(k){return teams[k];}).sort(function(x,y){return y.n-x.n||y.w/y.n-x.w/x.n;}).slice(0,10);
  picks.sort(function(x,y){return y.w-x.w;});
  h+='<div class="grid2"><div><div class="section-label">Favorite teams</div><div class="card"><table><thead><tr><th>Team</th><th class="r">Times</th><th class="r">Avg wins</th></tr></thead><tbody>'+
    tl.map(function(t){return '<tr><td>'+t.t+' <span class="muted small">'+t.ys.join(", ")+'</span></td><td class="r">'+t.n+'</td><td class="r">'+fmt1(t.w/t.n)+'</td></tr>';}).join("")+'</tbody></table></div></div>';
  h+='<div><div class="section-label">Best picks</div><div class="card"><table><tbody>'+picks.slice(0,5).map(pickRow).join("")+'</tbody></table></div>'+
    '<div class="section-label">Worst picks</div><div class="card"><table><tbody>'+picks.slice(-5).reverse().map(pickRow).join("")+'</tbody></table></div></div></div>';
  document.getElementById("h-players").innerHTML=h;
}
function pickRow(p){return '<tr><td>'+p.t+'</td><td class="muted">'+p.y+' &middot; pick '+p.pick+'</td><td class="r">'+p.w+'</td></tr>';}

// ===== RECORDS TAB =====
function renderRecords(){
  var ss=[],tp=[],tm={};
  DONE.forEach(function(y){S[y].list.forEach(function(p){ss.push({g:p.name,y:y,w:p.w,pay:p.pay,rank:p.rank});
    p.teams.forEach(function(t){tp.push({t:t.team,g:p.name,y:y,w:t.w,pick:t.pick});var k=t.team;(tm[k]=tm[k]||{t:k,n:0,w:0,owners:{}});tm[k].n++;tm[k].w+=t.w;tm[k].owners[p.name]=1;});});});
  function full(x){return SHORT.indexOf(x.y)<0;}
  function list(title,arr,cols,fn){return '<div><div class="section-label">'+title+'</div><div class="card scroll"><table><thead><tr><th>#</th>'+cols.map(function(c){return '<th'+(c[1]?' class="r"':'')+'>'+c[0]+'</th>';}).join("")+'</tr></thead><tbody>'+arr.map(function(x,i){return '<tr><td class="muted">'+(i+1)+'</td>'+fn(x)+'</tr>';}).join("")+'</tbody></table></div></div>';}
  var sc=[["Gambler"],["Season"],["Wins",1],["Payout",1]];
  function srow(x){return '<td>'+nm(x.g)+(x.rank===1?crown():'')+'</td><td>'+x.y+'</td><td class="r">'+x.w+'</td><td class="r">'+money(x.pay)+'</td>';}
  var tc=[["Team"],["Gambler"],["Season"],["Wins",1]];
  function trow(x){return '<td>'+x.t+'</td><td>'+nm(x.g)+'</td><td>'+x.y+' <span class="muted small">pick '+x.pick+'</span></td><td class="r">'+x.w+'</td>';}
  var h='<div class="grid2">'+
    list("Most wins in a season",ss.slice().sort(function(a,b){return b.w-a.w;}).slice(0,10),sc,srow)+
    list("Fewest wins in a season*",ss.filter(full).sort(function(a,b){return a.w-b.w;}).slice(0,10),sc,srow)+
    list("Biggest season payouts",ss.slice().sort(function(a,b){return b.pay-a.pay;}).slice(0,10),sc,srow)+
    list("Biggest season losses",ss.slice().sort(function(a,b){return a.pay-b.pay;}).slice(0,10),sc,srow)+
    list("Best single picks",tp.slice().sort(function(a,b){return b.w-a.w;}).slice(0,10),tc,trow)+
    list("Worst first-round picks*",tp.filter(function(x){return x.pick===1&&full(x);}).sort(function(a,b){return a.w-b.w;}).slice(0,10),tc,trow)+
    list("Most drafted teams",Object.keys(tm).map(function(k){return tm[k];}).sort(function(a,b){return b.n-a.n||b.w/b.n-a.w/a.n;}).slice(0,10),[["Team"],["Times",1],["Avg wins",1],["Owners",1]],function(x){return '<td>'+x.t+'</td><td class="r">'+x.n+'</td><td class="r">'+fmt1(x.w/x.n)+'</td><td class="r">'+Object.keys(x.owners).length+'</td>';})+
    list("Late-round steals (pick 5-8)",tp.filter(function(x){return x.pick>=5;}).sort(function(a,b){return b.w-a.w;}).slice(0,10),tc,trow)+
    '</div><div class="note">* Leaves out the COVID-shortened 2020-21 season, when teams played far fewer games. Payout records still count it, since payouts compare stables within the same season.</div>';
  document.getElementById("h-records").innerHTML=h;
}

// ===== SUB-TABS =====
function go(t){document.querySelectorAll("#tab-history .h-nav .pill").forEach(function(b){b.classList.toggle("active",b.dataset.sub===t);});
  document.querySelectorAll("#tab-history .h-sub").forEach(function(p){p.classList.toggle("active",p.id==="h-"+t);});
  ({seasons:renderSeasons,alltime:renderAllTime,players:renderPlayers,records:renderRecords})[t]();
  var top=document.getElementById("tab-history");if(top&&top.scrollIntoView&&window.scrollY>top.offsetTop)top.scrollIntoView();}
document.querySelectorAll("#tab-history .h-nav .pill").forEach(function(b){b.onclick=function(){go(b.dataset.sub);};});
window.HIST={
  year:function(y){selYear=y;renderSeasons();},
  open:function(y){selYear=y;go("seasons");},
  chart:function(m){chartMode=m;renderAllTime();},
  hide:function(n){hidden[n]=!hidden[n];renderAllTime();},
  sort:function(k){sortAT(k);},
  player:function(n){selP=n;renderPlayers();}
};
renderAllTime();renderSeasons();
})();
</script>
</body>
</html>
